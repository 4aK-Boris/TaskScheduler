# Auto-build the scheduler-infra Docker image and push it to GitHub Container Registry.
#
# Triggers:
#   * push to master      -> ghcr.io/4ak-boris/taskscheduler-infra:master + :sha-<short> + :latest
#   * push of a vX.Y.Z tag -> ...:X.Y.Z + :X.Y + :latest
#
# Deploy a published image with:
#   SCHEDULER_INFRA_IMAGE=ghcr.io/4ak-boris/taskscheduler-infra:latest docker compose up
# or:
#   docker run -p 8080:8080 -e POSTGRES_URL=... -e RABBITMQ_HOST=... \
#     ghcr.io/4ak-boris/taskscheduler-infra:latest
name: docker

on:
  push:
    branches: [master]
    tags: ['v*']

# GITHUB_TOKEN needs packages:write to push to GHCR; contents:read for checkout.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle build cache + the Kotlin/Wasm + Node toolchain downloads across runs,
      # so only the first build pays the full Compose-Wasm-distribution cost.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Produces standalone-runner/build/libs/standalone-runner-all.jar (bundles the Wasm dashboard
      # via processResources -> :dashboard-web:wasmJsBrowserDistribution).
      - name: Build infra shadow JAR
        run: ./gradlew --no-daemon :standalone-runner:shadowJar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR namespaces must be lowercase; the owner login (4aK-Boris) lowercases to 4ak-boris.
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/4ak-boris/taskscheduler-infra
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Context = the build/libs dir (only the fat JAR), Dockerfile reused from docker/infra/ — the
      # exact same inputs the local `./gradlew :standalone-runner:dockerImage` task uses.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: standalone-runner/build/libs
          file: docker/infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
