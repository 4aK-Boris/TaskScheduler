# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Compose Wasm production build (binaryen optimisation) needs >2GB; default 1GB OOMs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx4g

# Single source of truth for the release version: the published library coordinates
# (buildSrc .../publish.gradle.kts) AND the Docker image tag (buildsrc.convention.docker-image)
# both read this. Fixed release version (no -SNAPSHOT): Gradle caches releases, so consumers pick up
# changes only when this number bumps — cut a new version per release.
schedulerVersion=0.7.0
