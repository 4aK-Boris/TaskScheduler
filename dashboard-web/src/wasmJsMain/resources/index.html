<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Anchor every relative asset (the wasm loader, webpack chunks, composeResources) to the
         site root. Without this a deep-link reload like /jobs/{id} resolves "dashboard-web.js"
         against /jobs/, the SPA fallback returns index.html as text/html, the browser can't run
         it as a script, and the page is blank. The router itself already restores /jobs/{id}
         from window.location.pathname — only asset loading was broken. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3B4FD8">
    <title>TaskScheduler Dashboard</title>
    <!-- Inline SVG favicon: indigo tile + white clock (a scheduler). No binary asset, scales crisply. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233B4FD8'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M16 11V16l3.5 2.5' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #FBFBFE; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="dashboard-web.js"></script>
</body>
</html>
